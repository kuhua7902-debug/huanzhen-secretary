[pytest]
# 幻帧（Huanzhen）测试套件配置。
# 运行：venv\Scripts\python.exe -m pytest tests -q
testpaths = tests

# 让 tests/ 能直接 import core.* / nanobot.*（pytest>=7 内置选项，等价于 rootdir 入 sys.path）
pythonpath = .

addopts = -ra --strict-markers

markers =
    slow: 慢速或集成测试（重依赖导入 / 真实文件系统 IO），可用 -m "not slow" 跳过

xfail_strict = false

filterwarnings =
    default
    # 第三方库（chromadb / pydantic / 可选依赖）的噪音告警，不影响被测逻辑
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
    ignore::ResourceWarning
    ignore::UserWarning:multiprocessing.*
    ignore::UserWarning:pkg_resources.*
